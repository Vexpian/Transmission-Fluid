name: CI

on:
  push:
  pull_request:

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Check simulator and supplied circuits
        run: python tools/check_setup.py
      - name: Check locked.json files and hashes.txt
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path

          paths = sorted(Path(".").glob("tier*/locked.json"))
          assert len(paths) == 10, f"expected 10 locked.json files, found {len(paths)}"
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
          lines = Path("hashes.txt").read_text(encoding="utf-8").splitlines()
          assert len(lines) == 10, f"expected 10 lines in hashes.txt, found {len(lines)}"
          print("All files are intact")
          EOF
